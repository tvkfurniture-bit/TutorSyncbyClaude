<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0f2942" />
<title>TutorSync — Managed Tutor–Student Matching &amp; Academic Coordination</title>
<meta name="description" content="Free registration. Personally verified tutors and students, managed matching, transparent monthly billing across CBSE, ICSE and WB boards." />
<style>
:root{--bg:#fff;--surface:#f8fafc;--surface-alt:#f1f5f9;--primary:#0f2942;--primary-hover:#173b5e;--accent:#0284c7;--accent-light:#e0f2fe;--text:#0f172a;--text-muted:#475569;--border:#e2e8f0;--success:#16a34a;--success-bg:#dcfce7;--warning:#d97706;--warning-bg:#fef3c7;--danger:#dc2626;--danger-bg:#fee2e2;--radius:10px;--shadow-sm:0 1px 2px rgba(15,23,42,.05);--shadow-md:0 4px 14px rgba(15,23,42,.08);--font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--safe-b:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);color:var(--text);background:var(--bg);line-height:1.55;font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-variant-numeric:tabular-nums}
body.has-cta{padding-bottom:calc(66px + var(--safe-b))}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
h1,h2,h3,h4{margin:0 0 .5rem;color:var(--primary);font-weight:700;line-height:1.25}
p{margin:0 0 1rem;color:var(--text-muted)}
img,svg{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none!important}
.container{width:100%;max-width:1140px;margin:0 auto;padding:0 1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;padding:.62rem 1.15rem;border-radius:8px;font-weight:600;font-size:.9rem;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s;font-family:inherit;white-space:nowrap;text-decoration:none!important;min-height:40px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover:not(:disabled){background:var(--primary-hover)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover:not(:disabled){background:#0369a1}
.btn-outline{background:#fff;color:var(--primary);border-color:var(--border)}.btn-outline:hover:not(:disabled){background:var(--surface);border-color:#cbd5e1}
.btn-danger{background:var(--danger);color:#fff}
.btn-wa{background:#16a34a;color:#fff}
.btn-sm{padding:.35rem .72rem;font-size:.8rem;border-radius:6px;min-height:34px}
.btn-block{width:100%}
.card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;box-shadow:var(--shadow-sm);min-width:0}
.badge{display:inline-block;padding:.2rem .55rem;border-radius:999px;font-size:.74rem;font-weight:600;text-transform:uppercase;letter-spacing:.02em;background:var(--surface-alt);color:var(--text-muted)}
.badge-green{background:var(--success-bg);color:#166534}.badge-amber{background:var(--warning-bg);color:#92400e}.badge-red{background:var(--danger-bg);color:#991b1b}.badge-blue{background:var(--accent-light);color:#075985}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.form-group{display:flex;flex-direction:column;gap:.3rem;min-width:0}.form-group.full{grid-column:1/-1}
label{font-size:.84rem;font-weight:600;color:var(--primary)}
.req::after{content:" *";color:var(--danger)}
input,select,textarea{width:100%;padding:.58rem .75rem;border:1px solid #cbd5e1;border-radius:7px;font-family:inherit;font-size:.92rem;color:var(--text);background:#fff;min-height:40px}
input[type=checkbox],input[type=radio]{width:auto;min-height:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent-light);border-color:var(--accent)}
.field-error{font-size:.78rem;color:var(--danger);min-height:1em}
.chip-group{display:flex;flex-wrap:wrap;gap:.45rem}
.chip-label{display:inline-flex;align-items:center;gap:.3rem;padding:.4rem .7rem;border:1px solid var(--border);border-radius:999px;font-size:.82rem;font-weight:500;cursor:pointer;background:var(--surface);user-select:none}
.chip-label input{width:auto;margin:0}
.help-text{font-size:.78rem;color:var(--text-muted)}
.site-header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.97);backdrop-filter:blur(6px);border-bottom:1px solid var(--border)}
.nav-bar{display:flex;align-items:center;justify-content:space-between;height:64px;gap:.75rem}
.brand{display:flex;align-items:center;gap:.55rem;font-weight:800;font-size:1.18rem;color:var(--primary);cursor:pointer;flex-shrink:0}
.brand-mark{width:34px;height:34px;border-radius:8px;background:var(--primary);color:#fff;display:grid;place-items:center;flex-shrink:0}
.nav-links{display:flex;align-items:center;gap:1rem;font-size:.88rem;font-weight:500;white-space:nowrap}
.nav-links a{color:var(--text-muted)}.nav-links a:hover{color:var(--primary);text-decoration:none}
.nav-actions{display:flex;align-items:center;gap:.5rem}
.mobile-menu-btn{display:none;background:#fff;border:1px solid var(--border);border-radius:8px;width:42px;height:40px;cursor:pointer;font-size:1.15rem;align-items:center;justify-content:center}
.hero{padding:3.25rem 0 3rem;background-color:var(--surface);background-image:radial-gradient(#cbd5e1 .9px,transparent .9px);background-size:24px 24px;border-bottom:1px solid var(--border)}
.hero-grid{display:grid;grid-template-columns:1.2fr .95fr;gap:2.25rem;align-items:center}
.hero-pill{display:inline-flex;align-items:center;gap:.4rem;padding:.32rem .85rem;background:var(--accent-light);color:#0369a1;border-radius:999px;font-size:.8rem;font-weight:700;margin-bottom:1rem}
.hero h1{font-size:clamp(1.75rem,3.6vw,2.7rem);margin-bottom:.9rem}
.hero p{font-size:1.04rem;margin-bottom:1.45rem}
.hero-ctas{display:flex;flex-wrap:wrap;gap:.7rem;margin-bottom:1.35rem}
.einstein-quote{display:flex;align-items:flex-start;gap:.7rem;background:#fff;border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;padding:.75rem .95rem;font-size:.85rem;color:var(--text-muted)}
.chalkboard-card{background:var(--primary);color:#f8fafc;border-radius:14px;border:4px solid #1e3a5f;padding:1.1rem;box-shadow:var(--shadow-md)}
.chalkboard-caption{display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;margin-top:.75rem;padding-top:.65rem;border-top:1px dashed rgba(226,232,240,.25);font-size:.78rem;color:#cbd5e1}
.gallery-header{display:flex;align-items:flex-end;justify-content:space-between;gap:1rem;margin-bottom:1.15rem;flex-wrap:wrap}
.gallery-controls{display:flex;gap:.45rem;align-items:center;flex-wrap:wrap}
.scroll-track{display:flex;gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:.75rem;scrollbar-width:thin;scrollbar-color:#cbd5e1 transparent;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.scroll-track::-webkit-scrollbar{height:7px}.scroll-track::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:99px}
.edu-slide{flex:0 0 300px;scroll-snap-align:start;background:#fff;border:1px solid var(--border);border-radius:12px;overflow:hidden;box-shadow:var(--shadow-sm);display:flex;flex-direction:column}
.edu-slide-art{background:var(--surface);border-bottom:1px solid var(--border);padding:.85rem;display:flex;align-items:center;justify-content:center;height:168px}
.edu-slide-body{padding:1rem}.edu-slide-body h4{margin-bottom:.3rem;font-size:.98rem}.edu-slide-body p{margin:0;font-size:.84rem}
.dir-card{flex:0 0 315px;scroll-snap-align:start;background:#fff;border:1px solid var(--border);border-radius:12px;padding:1.05rem;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;justify-content:space-between;gap:.75rem}
.dir-modal-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.85rem}.dir-modal-grid .dir-card{flex:none;width:100%}
.dir-meta{font-size:.83rem;color:var(--text-muted);display:flex;flex-direction:column;gap:.25rem}
.dir-tags{display:flex;flex-wrap:wrap;gap:.3rem;margin:.35rem 0}
.dir-tag{font-size:.74rem;background:var(--surface-alt);color:var(--primary);padding:.18rem .5rem;border-radius:999px;font-weight:600}
.section{padding:3.1rem 0}.section-alt{background:var(--surface);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.section-head{text-align:center;max-width:660px;margin:0 auto 2rem}
.grid-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.1rem}.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.1rem}.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.25rem}
.icon-badge{width:38px;height:38px;border-radius:9px;background:var(--accent-light);color:var(--primary);display:inline-flex;align-items:center;justify-content:center;margin-bottom:.75rem;flex-shrink:0}
.step-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.65rem}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.82rem}
.faq-item{border:1px solid var(--border);border-radius:8px;background:#fff;margin-bottom:.65rem;overflow:hidden}
.faq-q{width:100%;text-align:left;background:none;border:none;padding:.95rem 1.1rem;font-weight:600;font-size:.95rem;color:var(--primary);cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:.75rem;font-family:inherit;min-height:48px}
.faq-a{padding:0 1.1rem 1rem;color:var(--text-muted);font-size:.9rem;display:none}.faq-item.open .faq-a{display:block}
.site-footer{padding:2.5rem 0 1.5rem;background:var(--primary);color:#cbd5e1;font-size:.86rem}
.site-footer a{color:#e2e8f0;display:block;padding:.2rem 0}.site-footer h4{color:#fff;font-size:.9rem;margin-bottom:.6rem}
.footer-grid{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:1.5rem}
.footer-bottom{margin-top:1.5rem;padding-top:1rem;border-top:1px solid rgba(226,232,240,.2);font-size:.78rem;color:#94a3b8}
.trust-list{list-style:none;padding:0;margin:0;display:grid;gap:.6rem}
.trust-list li{display:flex;gap:.6rem;align-items:flex-start;color:var(--text-muted);font-size:.9rem}
.trust-list li::before{content:"✓";color:var(--success);font-weight:800;flex-shrink:0}
.mobile-cta{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;gap:.5rem;padding:.6rem .75rem calc(.6rem + var(--safe-b));background:rgba(255,255,255,.98);border-top:1px solid var(--border);box-shadow:0 -4px 14px rgba(15,23,42,.08)}
.mobile-cta .btn{flex:1}
.portal-shell{display:flex;min-height:calc(100vh - 64px);background:var(--surface)}
.sidebar{width:248px;flex-shrink:0;background:#fff;border-right:1px solid var(--border);padding:1rem .75rem;display:flex;flex-direction:column;gap:.25rem}
.sidebar-group{font-size:.72rem;font-weight:700;text-transform:uppercase;color:var(--text-muted);padding:.75rem .65rem .3rem;letter-spacing:.04em}
.side-btn{width:100%;text-align:left;background:none;border:none;border-radius:7px;padding:.6rem .75rem;font-size:.88rem;font-weight:500;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-family:inherit;min-height:40px}
.side-btn:hover{background:var(--surface);color:var(--primary)}.side-btn.active{background:var(--accent-light);color:var(--primary);font-weight:700}
.sidebar-overlay{position:fixed;inset:64px 0 0 0;background:rgba(15,23,42,.4);z-index:48;display:none}
.main-area{flex:1;min-width:0;padding:1.5rem}
.topbar-portal{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1.25rem;padding-bottom:.85rem;border-bottom:1px solid var(--border)}
.tabs-row{display:flex;gap:.4rem;flex-wrap:wrap}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:.85rem;margin-bottom:1.25rem}
.kpi-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:.95rem 1rem;border-top:3px solid var(--primary);min-width:0}
.kpi-label{font-size:.76rem;font-weight:600;color:var(--text-muted);text-transform:uppercase}
.kpi-val{font-size:1.4rem;font-weight:800;color:var(--primary);margin:.2rem 0;word-break:break-word}
.kpi-sub{font-size:.78rem;color:var(--text-muted)}
.table-toolbar{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:space-between;align-items:center;margin-bottom:.85rem}
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;border:1px solid var(--border);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;font-size:.86rem}
th{background:var(--surface);text-align:left;padding:.7rem .85rem;font-weight:600;color:var(--primary);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer}
td{padding:.68rem .85rem;border-bottom:1px solid var(--border);vertical-align:top}
tr:last-child td{border-bottom:none}.num{text-align:right}
.pagination{display:flex;justify-content:space-between;align-items:center;margin-top:.75rem;font-size:.84rem;color:var(--text-muted);gap:.5rem;flex-wrap:wrap}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-box{background:#fff;border-radius:12px;width:100%;max-width:780px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-md);overflow:hidden}
.modal-head{padding:1rem 1.25rem;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:.75rem}
.modal-body{padding:1.25rem;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-foot{padding:.85rem 1.25rem;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:.6rem;background:var(--surface)}
#toast-container{position:fixed;top:.75rem;right:.75rem;left:.75rem;z-index:200;display:flex;flex-direction:column;gap:.5rem;max-width:380px;margin-left:auto;pointer-events:none}
.toast{background:#fff;border:1px solid var(--border);border-left:4px solid var(--primary);padding:.8rem 1rem;border-radius:8px;box-shadow:var(--shadow-md);font-size:.88rem;pointer-events:auto;word-break:break-word}
.toast.success{border-left-color:var(--success)}.toast.error{border-left-color:var(--danger)}
.loader-overlay{position:fixed;inset:0;background:rgba(255,255,255,.68);z-index:150;display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--primary)}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite;margin-right:.6rem}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{background:linear-gradient(90deg,#eef2f7 25%,#f8fafc 50%,#eef2f7 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px;height:18px;margin:.5rem 0}
@keyframes sh{to{background-position:-200% 0}}
.score-bar{width:80px;height:7px;background:var(--surface-alt);border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}.score-fill{height:100%;background:var(--accent)}
.empty-state{text-align:center;padding:2rem 1rem;color:var(--text-muted)}
.qr-box{display:flex;justify-content:center;padding:1rem;background:#fff;border:1px solid var(--border);border-radius:10px;margin:.5rem 0}
.gate-card{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:8px;padding:.8rem 1rem;margin-bottom:.6rem;background:#fff;display:flex;justify-content:space-between;gap:.75rem;flex-wrap:wrap;align-items:center}
.meter{height:8px;background:var(--surface-alt);border-radius:99px;overflow:hidden}.meter>div{height:100%;background:var(--accent)}
.legal p{color:var(--text-muted)}
@media(max-width:960px){
.hero-grid{grid-template-columns:1fr}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:1fr}.footer-grid{grid-template-columns:1fr 1fr}
.nav-links{display:none}.mobile-menu-btn{display:inline-flex}
.sidebar{position:fixed;left:-270px;top:64px;bottom:0;z-index:49;transition:left .2s;box-shadow:var(--shadow-md);overflow-y:auto}.sidebar.open{left:0}
.sidebar.open~.main-area{}}
@media(max-width:720px){
body{font-size:15px}
input,select,textarea{font-size:16px}
.form-grid,.grid-2,.grid-4,.dir-modal-grid,.footer-grid{grid-template-columns:1fr}
.main-area{padding:1rem}.section{padding:2.25rem 0}.hero{padding:2rem 0}
.edu-slide,.dir-card{flex:0 0 82vw;max-width:300px}
.modal-backdrop{padding:0;align-items:flex-end}.modal-box{max-width:100%;max-height:94vh;border-radius:14px 14px 0 0}
.mobile-cta.show{display:flex}
.nav-actions .btn{padding:.35rem .6rem;font-size:.78rem}
.hero-ctas .btn{flex:1 1 100%}
#toast-container{top:auto;bottom:calc(72px + var(--safe-b))}
.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:380px){.brand span:last-child{font-size:1.02rem}.nav-actions #nav-login-btn{display:none}}
</style>
</head>

<div id="toast-container" aria-live="polite"></div>

<header class="site-header">

    <div class="brand" onclick="App.navigate('#/')" role="link" tabindex="0" aria-label="TutorSync home">

<script>
/**
 * TUTORSYNC FRONTEND (GitHub Pages single-file SPA) — Autopilot edition
 * Backend: Google Apps Script (CORS-safe text/plain POST, redirect follow).
 */
window.TUTORSYNC_CONFIG = {
  DEFAULT_API_URL: 'https://script.google.com/macros/s/AKfycbyh_gy3jeJGosnIqDx7iyrCDd5R5sR3GMTsm4PWrVYRxWKfvnw5aJGwuZxaw-Wxd6ifkw/exec',
  STORAGE_API_KEY: 'tutorsync_gas_url',
  STORAGE_SESSION_KEY: 'tutorsync_session'
};

const App = (function () {
  const state = {
    apiUrl: window.TUTORSYNC_CONFIG.DEFAULT_API_URL || localStorage.getItem(window.TUTORSYNC_CONFIG.STORAGE_API_KEY) || '',
    session: (function(){ try { return JSON.parse(sessionStorage.getItem(window.TUTORSYNC_CONFIG.STORAGE_SESSION_KEY) || 'null'); } catch (e) { return null; } })(),
    publicConfig: {
      boards: ['CBSE','ICSE','WB','OTHER'], modes: ['ONLINE','OFFLINE','HYBRID'],
      classes: ['Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8','Class 9','Class 10','Class 11','Class 12','Undergraduate','Competitive Exams'],
      subjects: ['Mathematics','Science','Physics','Chemistry','Biology','English','Bengali','Hindi','History','Geography','Computer Science','Economics','Accountancy','Business Studies','All Subjects'],
      supportEmail: '', supportWhatsApp: ''
    },
    publicDirectory: { tutors: [], students: [], loaded: false },
    dirTab: 'tutors', dirQuery: '', dirMode: '',
    prefillStudent: null, prefillTutor: null,
    adminModule: 'gates', adminCache: {}, portalTab: 'overview'

  /* ---------- helpers ---------- */
  function esc(s){ if(s===null||s===undefined) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
  function parseArr(v){ if(Array.isArray(v)) return v; if(!v) return []; try{ const p=JSON.parse(v); return Array.isArray(p)?p:[String(v)]; }catch(e){ return String(v).split(',').map(s=>s.trim()).filter(Boolean); } }
  const inrFmt0 = new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0});
  const inrFmt2 = new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',minimumFractionDigits:2,maximumFractionDigits:2});
  function inr(n){ const v=Number(n||0); return Number.isInteger(v)?inrFmt0.format(v):inrFmt2.format(v); }
  function skel(n){ let h=''; for(let i=0;i<(n||4);i++) h+='<div class="skel" style="width:'+(60+((i*17)%40))+'%"></div>'; return '<div class="card">'+h+'</div>'; }
  function isBool(v){ return v===true||v==='TRUE'; }
  function waLink(phone,text){ const d=String(phone||'').replace(/\D/g,'').slice(-10); return d.length===10?'https://wa.me/91'+d+'?text='+encodeURIComponent(text||''):''; }
  function waBtn(phone,text,label){ const l=waLink(phone,text); return l?'<a class="btn btn-wa btn-sm" href="'+esc(l)+'" target="_blank" rel="noopener">'+esc(label||'WhatsApp')+'</a>':''; }
  const PHONE_RE = /^[6-9]\d{9}$/;
  function cleanPhone(v){ let d=String(v||'').replace(/\D/g,''); if(d.length===12&&d.indexOf('91')===0) d=d.slice(2); if(d.length===11&&d[0]==='0') d=d.slice(1); return d; }

  function statusBadge(status){
    const s=String(status||'').toUpperCase(); let cls='';
    if(['ACTIVE','VERIFIED','PAID','COMPLETED','RESOLVED','SENT','TRIAL_COMPLETED'].indexOf(s)!==-1) cls='badge-green';
    else if(['NEW','UNDER_REVIEW','PROPOSED','OFFERED','ACCEPTED','PARTIALLY_PAID','PENDING','APPROVED','IN_PROGRESS','SHORTLISTED','ISSUED','TRIAL_SCHEDULED'].indexOf(s)!==-1) cls='badge-blue';
    else if(['ON_HOLD','SCHEDULED','SUGGESTED','OPEN','IN_BATCH'].indexOf(s)!==-1) cls='badge-amber';
    else if(['REJECTED','CANCELLED','OVERDUE','FAILED','LOCKED','DISABLED'].indexOf(s)!==-1) cls='badge-red';
    return '<span class="badge '+cls+'">'+esc(s)+'</span>';
  }
  function toast(msg,type){ const c=document.getElementById('toast-container'); const el=document.createElement('div'); el.className='toast '+(type||''); el.setAttribute('role',type==='error'?'alert':'status'); el.textContent=msg; c.appendChild(el); setTimeout(()=>{ if(el.parentNode) el.parentNode.removeChild(el); },4800); }
  function setLoading(f){ document.getElementById('loader').classList.toggle('hidden',!f); }

  async function apiCall(action,payload,opts){
    const options=opts||{};
    if(!state.apiUrl){ if(!options.suppressErrorToast) toast('Service endpoint is not configured yet. Please contact support.','error'); throw new Error('Backend API URL is not configured.'); }
    if(!options.silent) setLoading(true);
    const controller=new AbortController(); const timer=setTimeout(()=>controller.abort(),35000);
    const bodyStr=JSON.stringify({action:action,sessionToken:state.session?state.session.sessionToken:'',payload:payload||{}});
    try{
      let res;
      try{ res=await fetch(state.apiUrl,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:bodyStr,signal:controller.signal}); }
      catch(netErr){ if(options.allowRetry){ res=await fetch(state.apiUrl,{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:bodyStr}); } else throw netErr; }
      const json=await res.json();
      if(!json.ok){
        if(json.code==='UNAUTHORIZED'&&state.session){ state.session=null; sessionStorage.removeItem(window.TUTORSYNC_CONFIG.STORAGE_SESSION_KEY); updateNav(); navigate('#/login'); }
        throw new Error(json.message||'Server request failed.');
      }
      return json.data;
    }catch(err){
      const msg=err.name==='AbortError'?'Request timed out. Please try again.':(err.message||'Network error.');
      if(!options.suppressErrorToast) toast(msg,'error');
      throw err;
    }finally{ clearTimeout(timer); if(!options.silent) setLoading(false); }
  }

  let pinTimer=null;
  async function lookupPin(pinId,areaId,hintId){
    const pin=(document.getElementById(pinId).value||'').trim(); const hint=document.getElementById(hintId);
    if(!/^\d{6}$/.test(pin)){ if(hint) hint.textContent=''; return; }
    clearTimeout(pinTimer);
    pinTimer=setTimeout(async function(){
      try{
        const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),5000);
        const r=await fetch('https://api.postalpincode.in/pincode/'+pin,{signal:ctl.signal}); clearTimeout(t);
        const j=await r.json(); const po=j&&j[0]&&j[0].Status==='Success'&&j[0].PostOffice&&j[0].PostOffice[0];
        if(po){
          if(hint) hint.textContent='📍 '+po.Name+', '+po.District+', '+po.State;
          const a=document.getElementById(areaId); if(a&&!a.value) a.value=po.Name+', '+po.District;
        } else if(hint) hint.textContent='';
      }catch(e){ if(hint) hint.textContent=''; }
    },350);
  }

  function lookupTutorPin(){
    const parts=(document.getElementById('tr-pins').value||'').split(',').map(s=>s.trim()).filter(Boolean); const last=parts[parts.length-1]||''; const hint=document.getElementById('tr-pin-hint');
    if(!/^\d{6}$/.test(last)){ hint.textContent=''; return; }
    clearTimeout(pinTimer); pinTimer=setTimeout(async function(){
      try{ const ctl=new AbortController(); const t=setTimeout(()=>ctl.abort(),5000); const r=await fetch('https://api.postalpincode.in/pincode/'+last,{signal:ctl.signal}); clearTimeout(t); const j=await r.json(); const po=j&&j[0]&&j[0].Status==='Success'&&j[0].PostOffice&&j[0].PostOffice[0]; hint.textContent=po?('📍 '+last+': '+po.Name+', '+po.District):''; }catch(e){ hint.textContent=''; }
    },350);
  }

  function renderQr(elId,text,tries){
    tries=tries||0; const el=document.getElementById(elId); if(!el) return;
    if(window.QRCode){ el.innerHTML=''; try{ new window.QRCode(el,{text:text,width:200,height:200,correctLevel:window.QRCode.CorrectLevel.M}); }catch(e){ el.innerHTML='<p class="help-text">QR could not be drawn. Use the “Open UPI App” button.</p>'; } }
    else if(tries<20) setTimeout(()=>renderQr(elId,text,tries+1),250);
    else el.innerHTML='<p class="help-text">QR is unavailable offline. Use the “Open UPI App” button instead.</p>';
  }
  function copyText(t){ if(navigator.clipboard&&t){ navigator.clipboard.writeText(t).then(()=>toast('Copied.','success'),()=>toast('Copy failed.','error')); } else toast('Copy is not supported on this device.','error'); }
  async function submitUtrClaim(e,invoiceId){
    e.preventDefault();
    const utr=document.getElementById('utr-ref').value.trim().toUpperCase();
    if(!/^[A-Z0-9]{8,30}$/.test(utr)) return toast('Enter a valid UTR (8–30 letters/digits).','error');
    if(!confirm('Submit this payment claim? Please double-check the UTR and amount.')) return;
    try{
      await apiCall('studentSubmitUtrClaim',{invoiceId:invoiceId,amount:document.getElementById('utr-amt').value,utr:utr,note:document.getElementById('utr-note').value});
      closeModal(); toast('Claim submitted. We will verify it and issue your receipt.','success'); renderStudentPortal();
    }catch(err){}
  }

  function renderDataTable(containerId,config){
    const el=document.getElementById(containerId); if(!el) return;
    const pageSize=20; let query='',filterVal='',page=1,sortCol=null,sortAsc=true;
    function draw(){
      let rows=config.rows.slice();
      if(filterVal&&config.filterField) rows=rows.filter(r=>String(r[config.filterField])===filterVal);
      if(query){ const q=query.toLowerCase(); rows=rows.filter(r=>config.columns.some(c=>String(r[c.key]||'').toLowerCase().indexOf(q)!==-1)); }
      if(sortCol) rows.sort((a,b)=>{ const av=a[sortCol]||'',bv=b[sortCol]||''; return sortAsc?String(av).localeCompare(String(bv),undefined,{numeric:true}):String(bv).localeCompare(String(av),undefined,{numeric:true}); });
      const total=rows.length, pages=Math.max(1,Math.ceil(total/pageSize)); if(page>pages) page=pages;
      const slice=rows.slice((page-1)*pageSize,page*pageSize);
      el.innerHTML='<div class="table-toolbar"><div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center"><input type="search" placeholder="Search..." aria-label="Search table" value="'+esc(query)+'" style="width:200px;max-width:100%" id="'+containerId+'-q" />'+
        (config.filterOptions?'<select id="'+containerId+'-f" aria-label="Filter by status" style="width:170px"><option value="">All Statuses</option>'+config.filterOptions.map(o=>'<option value="'+esc(o)+'"'+(filterVal===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>':'')+'</div><div style="display:flex;gap:.4rem">'+(config.toolbarHtml||'')+'</div></div>'+
        '<div class="table-wrap"><table><thead><tr>'+config.columns.map(c=>'<th data-col="'+esc(c.key)+'" scope="col">'+esc(c.label)+'</th>').join('')+(config.actions?'<th scope="col">Actions</th>':'')+'</tr></thead><tbody>'+
        (slice.length?slice.map(r=>'<tr>'+config.columns.map(c=>'<td class="'+(c.num?'num':'')+'">'+(c.render?c.render(r):esc(r[c.key]))+'</td>').join('')+(config.actions?'<td>'+config.actions(r)+'</td>':'')+'</tr>').join(''):'<tr><td colspan="'+(config.columns.length+(config.actions?1:0))+'" class="empty-state">No matching records found.</td></tr>')+
        '</tbody></table></div><div class="pagination"><span>Showing '+slice.length+' of '+total+' (Page '+page+'/'+pages+')</span><div style="display:flex;gap:.35rem"><button class="btn btn-outline btn-sm" '+(page<=1?'disabled':'')+' id="'+containerId+'-prev">Prev</button><button class="btn btn-outline btn-sm" '+(page>=pages?'disabled':'')+' id="'+containerId+'-next">Next</button></div></div>';
      const qEl=document.getElementById(containerId+'-q'); qEl.oninput=()=>{ query=qEl.value; page=1; draw(); const n=document.getElementById(containerId+'-q'); if(n){ n.focus(); n.setSelectionRange(n.value.length,n.value.length); } };
      const fEl=document.getElementById(containerId+'-f'); if(fEl) fEl.onchange=()=>{ filterVal=fEl.value; page=1; draw(); };
      el.querySelectorAll('th[data-col]').forEach(th=>th.onclick=()=>{ const col=th.getAttribute('data-col'); if(sortCol===col) sortAsc=!sortAsc; else{ sortCol=col; sortAsc=true; } draw(); });
      document.getElementById(containerId+'-prev').onclick=()=>{ if(page>1){ page--; draw(); } };
      document.getElementById(containerId+'-next').onclick=()=>{ if(page<pages){ page++; draw(); } };
    }
    draw();
  }

  function exportToCsv(filename,headers,rows){
    const cell=v=>{ let s=String(v===null||v===undefined?'':v); if(/^[=+\-@]/.test(s)) s="'"+s; return '"'+s.replace(/"/g,'""')+'"'; };
    const lines=[headers.map(cell).join(',')].concat(rows.map(r=>r.map(cell).join(',')));
    const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8;'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(()=>URL.revokeObjectURL(url),1000);
  }

    runMatching,saveMatch,openAssignmentModal,saveAssignment,changeAsgStatus,setTrialPrompt,
    openBatchSessionModal,submitBatchSessions,correctSessionPrompt,
    openGenerateInvoicesModal,submitGenerateInvoices,openRecordPaymentModal,submitRecordPayment,adjustInvoicePrompt,voidInvoicePrompt,resendInvoice,
    refundPrompt,adjustLedgerPrompt,createPayoutBatchPrompt,approvePayout,openMarkPaidModal,submitMarkPayoutPaid,
